[package]
name = "dpop"
version = "0.1.1"
edition = "2024"
description = "An implementation of DPoP for rust."
repository = "https://github.com/manomayam/manas"
license = "MIT OR Apache-2.0"


[dependencies]
base64 = "0.22.1"
canonical_json = "0.5.0"
frunk_core = "0.4.4"
gdp_rs = { version = "0.1.1", path = "../gdp_rs", features = ["serde"] }
http = "1.3.1"
http-serde = "2.1.1"
http_uri = { version = "1.0.1", path = "../http_uri", features = ["serde"] }
once_cell = { version = "1.21.3" }
picky = { version = "7.0.0-rc.15", default-features = false, features = [
    "jose",
] }
regex = { version = "1.11.1" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
uuid = { version = "1.17.0", features = ["v4"] }

# feature: http-header
bytes = { version = "1.10.1", optional = true }
itertools = { version = "0.14.0", optional = true }
headers = { version = "0.4.1", optional = true }

[features]
http-header = ["dep:headers", "dep:bytes", "dep:itertools"]
# TODO must be removed.
unsafe-optional-ath-claim = []

[dev-dependencies]
claims = "0.8.0"
rstest = "0.25.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "doc_cfg"]
