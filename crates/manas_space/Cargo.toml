[package]
name = "manas_space"
version = "0.1.0"
edition = "2024"
description = "This crate provides abstractions for modelling storage spaces confirming to generalized solid protocol."
repository = "https://github.com/manomayam/manas"
license = "MIT OR Apache-2.0"


[dependencies]
manas_http = { version = "0.1.1", path = "../manas_http", features = [
    "representation",
    "typed-headers",
] }
thiserror = "2.0.12"
once_cell = "1.21.3"
iri-string = "0.7.8"
smallvec = "1.15.1"
dyn-clone = "1.0.19"
if_chain = "1.0.2"
gdp_rs = { version = "0.1.1", path = "../../fcrates/gdp_rs" }
headers = "0.4.1"
http = "1.3.1"
mime = "0.3.17"
vec1 = "1.12.1"

# feature: test-utils
claims = { version = "0.8.0", optional = true }
rstest = { version = "0.25.0", optional = true }
webid = { version = "0.1.0", path = "../../fcrates/webid" }


[dev-dependencies]
claims = "0.8.0"
rstest = "0.25.0"
manas_http = { version = "0.1.1", path = "../manas_http", features = [
    "representation",
    "typed-headers",
    "test-utils",
] }

[features]
test-utils = ["dep:rstest", "dep:claims", "manas_http/test-utils"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "doc_cfg"]
